name: Release (pacote do Gemini CLI)

# O Gemini CLI exige o gemini-extension.json na raiz do pacote. Como a fonte das
# skills vive em plugins/apipass-integrations/, publicamos um .tar.gz montado por
# scripts/build.mjs como asset da release — e o que
# `gemini extensions install https://github.com/APIPASS-Integrations/apipass-headless`
# baixa. Claude, Codex, Copilot e Cursor instalam direto do repositorio.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar
        run: node scripts/build.mjs --check
      - name: Conferir tag x versao
        run: |
          v=$(node -p "require('./plugins/apipass-integrations/.claude-plugin/plugin.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != versao v$v"; exit 1; }
      - name: Montar pacote do Gemini
        run: node scripts/build.mjs --pack
      - name: Publicar release com o asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/apipass-integrations.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/apipass-integrations.tar.gz --generate-notes --latest
          fi
